# .github/workflows/daily-sync.yml
# Saves one snapshot per day at midnight IST and, if turned on, yesterday's report.
#
# GitHub's own schedule often starts hours late, which shifts the day boundaries.
# The real trigger is an outside scheduler (e.g. cron-job.org) calling "workflow_dispatch"
# at 00:05 IST. The schedule below is only a backup: if the outside trigger already ran,
# today's snapshot exists and the backup run leaves it unchanged.
name: Daily Smartlead sync

on:
  workflow_dispatch: {}
  schedule:
    # 18:35 UTC = 00:05 IST (backup only; GitHub may run it hours late)
    - cron: "35 18 * * *"

permissions:
  contents: write

concurrency:
  group: smartlead-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Save Smartlead snapshot
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          DASHBOARD_TIME_ZONE: Asia/Kolkata
        run: node scripts/fetch-smartlead.mjs

      - name: Save yesterday's report
        # Only runs when the repository variable SAVE_REPORTS is "true".
        # Turn it on only after the repo is private: these files contain lead emails and replies.
        continue-on-error: true
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          SAVE_REPORTS: ${{ vars.SAVE_REPORTS }}
        run: node scripts/build-reports.mjs

      - name: Commit updated data
        run: |
          git config user.name "smartlead-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: Smartlead snapshot $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
