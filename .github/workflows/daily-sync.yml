# .github/workflows/daily-sync.yml
# Saves one snapshot per day just after midnight IST.
# The dashboard is live on its own; this only builds the history for daily trends.
name: Daily Smartlead sync

on:
  schedule:
    # 18:35 UTC = 00:05 IST, every day
    - cron: "35 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: smartlead-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Save Smartlead snapshot
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          DASHBOARD_TIME_ZONE: Asia/Kolkata
        run: node scripts/fetch-smartlead.mjs

      - name: Commit updated data
        run: |
          git config user.name "smartlead-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: Smartlead snapshot $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
